name: Build & Push image

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  # GHCR требует image name в нижнем регистре, поэтому приводим owner к lowercase в jobs.
  IMAGE_PATH: postgres-backup

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Build image (export to tar)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: false
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: /tmp/image.tar
          retention-days: 1

  push:
    name: Push image to GHCR
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: image
          path: /tmp

      - name: Load image into Docker
        run: docker load --input /tmp/image.tar

      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Apply tags
        run: |
          IMAGE="${{ steps.image.outputs.name }}"
          docker tag "${IMAGE}:${GITHUB_SHA}" "${IMAGE}:latest"
          docker tag "${IMAGE}:${GITHUB_SHA}" "${IMAGE}:${GITHUB_REF_NAME}"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          IMAGE="${{ steps.image.outputs.name }}"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_REF_NAME}"

      - name: Show pushed digest
        run: |
          docker image inspect "${{ steps.image.outputs.name }}:${GITHUB_SHA}" --format 'Digest: {{index .RepoDigests 0}}'
